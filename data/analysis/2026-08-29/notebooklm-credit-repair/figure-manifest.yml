      context_after: 第二个常见误区，是把信用修复写成“政府帮企业把信用洗回来”。这弄错了主体。《关于健全社会信用体系的意见》在完善信用修复制度那条里明确指出：“鼓励失信主体**主动
    - id: fig-86-06
      before_heading: '## 三、统一办理：从“多头跑”到“一件事”'
      context_after: 纠错完成后，接下来是程序问题：去哪修、怎么修、多久能修完。这个问题在过去是真痛点。企业可能在一个地方被处罚，在另一个地方投标受限，修复标准各地不一、材料重复交、
    - id: fig-86-07
      before_heading: '## 四、协同修复与依法退出：退出的是状态，留下的是事实'
      context_after: 比“多头跑”更难的，是破产企业的信用修复。企业都要退市了，还修复信用做什么？这恰恰最考验治理功力。广西的答案是“四个一”全链条解决方案：一套联动机制、一笔兜底资
    - id: fig-86-09
      before_heading: '## 五、关口前移：最好的修复，是让小过失不留痕'
      context_after: 沿着这个链条思考，还有一个更高层次的问题：能否让企业从一开始就不需要修复？广西在2026年1月出台的《广西市场监管领域信用豁免管理制度（试行）》回答了这个问题。
