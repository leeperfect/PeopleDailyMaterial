      inline_marker: '![第89篇配图01](media/images/2026-08-30-article-89/fig-89-01.png)'
      anchor_before: 89｜《人民日报》深度分析【职业伤害保障】：不能等出了事故再赔钱，预防、认定、理赔、康复要接起来
      anchor_after: 发生事故后，最让人焦虑的往往不只是伤口本身。
      context_after: 传统保障制度通常建立在相对稳定的劳动关系、工资总额和固定单位之上。平台用工却可能是按单接活、灵活上线、多地流动。如果仍用固定单位、固定工时的思路识别保障责任，就
    - id: fig-89-02
      before_heading: '## 一、保障跟着订单走：先解决谁来交、保住谁'
      inline_marker: '![第89篇配图02](media/images/2026-08-30-article-89/fig-89-02.png)'
      anchor_before: 这个案例最容易被记住的是“当天到账”。但如果职业伤害保障只剩下一个“赔得快”，就把问题看窄了。
      anchor_after: 对外卖骑手、网约车司机、同城货运司机等从业者来说，工作按单发生、地点不断变化、可能跨平台接单。真正有效的保障，必须回答一整套问题：责任怎样跟着订单走，风险怎样提前减少，事故怎样便捷报案，伤害怎样协同确认，案件怎样分类理赔，治疗之后怎样接上康复和救济。
      context_after: 传统保障制度通常建立在相对稳定的劳动关系、工资总额和固定单位之上。平台用工却可能是按单接活、灵活上线、多地流动。如果仍用固定单位、固定工时的思路识别保障责任，就
    - id: fig-89-03
      before_heading: '## 一、保障跟着订单走：先解决谁来交、保住谁'
      inline_marker: '![第89篇配图03](media/images/2026-08-30-article-89/fig-89-03.png)'
      anchor_before: 对外卖骑手、网约车司机、同城货运司机等从业者来说，工作按单发生、地点不断变化、可能跨平台接单。真正有效的保障，必须回答一整套问题：责任怎样跟着订单走，风险怎样提前减少，事故怎样便捷报案，伤害怎样协同确认，案件怎样分类理赔，治疗之后怎样接上康复和救济。
      anchor_after: 职业伤害保障的完整逻辑是：订单触发保障 → 风险前置预防 → 一键报案 → 协同认定 → 分类理赔 → 康复救济。
      context_after: 传统保障制度通常建立在相对稳定的劳动关系、工资总额和固定单位之上。平台用工却可能是按单接活、灵活上线、多地流动。如果仍用固定单位、固定工时的思路识别保障责任，就
    - id: fig-89-04
      before_heading: '## 一、保障跟着订单走：先解决谁来交、保住谁'
      inline_marker: '![第89篇配图04](media/images/2026-08-30-article-89/fig-89-04.png)'
      anchor_before: 职业伤害保障的完整逻辑是：订单触发保障 → 风险前置预防 → 一键报案 → 协同认定 → 分类理赔 → 康复救济。
      anchor_after: 一、保障跟着订单走：先解决谁来交、保住谁
      context_after: 传统保障制度通常建立在相对稳定的劳动关系、工资总额和固定单位之上。平台用工却可能是按单接活、灵活上线、多地流动。如果仍用固定单位、固定工时的思路识别保障责任，就
    - id: fig-89-05
      before_heading: '## 二、风险提前防：赔得再快，也不能代替少出事故'
      inline_marker: '![第89篇配图05](media/images/2026-08-30-article-89/fig-89-05.png)'
      anchor_before: 申论可用表达：适应就业形态变化，应以真实劳动过程为责任连接点，推动保障随订单生成、责任随业务落实、权益随劳动者流动。
      anchor_after: 二、风险提前防：赔得再快，也不能代替少出事故
      context_after: 职业伤害保障最直观的作用，是在事故后报销医疗费用、发放相关待遇。但对管理者而言，更应追问的是：哪些事故原本可以避免？平台并非看不见风险。订单密度、配送路线、在线
    - id: fig-89-06
      before_heading: '## 三、报案与认定协同：群众报一次，后台多协同'
      inline_marker: '![第89篇配图06](media/images/2026-08-30-article-89/fig-89-06.png)'
      anchor_before: 赔付速度再快，也不能成为容忍高风险劳动规则的理由。
      anchor_after: 三、报案与认定协同：群众报一次，后台多协同
      context_after: 事故发生后，劳动者首先面对的是报案入口。如果平台APP里找不到入口，或者报案后还要分别联系平台、经办机构、保险机构和鉴定部门，所谓的保障就可能卡在第一步。真正便
    - id: fig-89-07
      before_heading: '## 四、理赔分类办：小伤快赔，复杂案件不能草率快结'
      inline_marker: '![第89篇配图07](media/images/2026-08-30-article-89/fig-89-07.png)'
      anchor_before: 服务流程再复杂，也不该把复杂留给受伤的人。
      anchor_after: 四、理赔分类办：小伤快赔，复杂案件不能草率快结
      context_after: 提高理赔效率，最怕把所有案件都塞进同一个快车道。北京对“小伤”的范围有明确限定：仅在门急诊就医、不需要住院，事实清楚、资料齐全、责任划分明确且不存在争议。满足这
    - id: fig-89-08
      before_heading: '## 五、康复与救济接续：到账不是终点，重新生活和工作才是'
      inline_marker: '![第89篇配图08](media/images/2026-08-30-article-89/fig-89-08.png)'
      anchor_before: 快赔的价值，不是让所有案件都快，而是让简单案件不再占用复杂程序，让复杂案件得到应有的审慎。
      anchor_after: 五、康复与救济接续：到账不是终点，重新生活和工作才是
      context_after: 医疗费用到账，只是解决了事故后的一个节点问题。有人治疗结束后还需要康复训练，有人因劳动能力变化无法立即恢复原工作，还有人会遇到工资扣减、平台拒绝确认、第三人赔偿
    - id: fig-89-10
      before_heading: '## 六、国考省考申论面试怎么用'
      inline_marker: '![第89篇配图10](media/images/2026-08-30-article-89/fig-89-10.png)'
      anchor_before: 山东泰安的案例显示，一名骑手通过配送记录、工资流水和就医凭证固定证据，相关服务力量帮助其进入协商调解程序。这个案例虽不属于职业伤害保障试点理赔，但它提醒我们：线上入口适合处理标准事项，线下专业力量必须接住复杂的人和事。
      anchor_after: 职业伤害保障的目标，不只是把一笔钱打进账户，更是帮助受伤者完成治疗、恢复能力、解决争议，重新获得稳定生活的可能。
      context_after: 这类题最容易写成“扩大保障范围、提高理赔效率、加强宣传培训”三句话。方向没错，但缺少制度链条。可以直接使用这套公式：**责任随单落实+风险前端预防+报案一次提交
    - id: fig-89-09
      before_heading: '## 六、国考省考申论面试怎么用'
      inline_marker: '![第89篇配图09](media/images/2026-08-30-article-89/fig-89-09.png)'
      anchor_before: 职业伤害保障的目标，不只是把一笔钱打进账户，更是帮助受伤者完成治疗、恢复能力、解决争议，重新获得稳定生活的可能。
      anchor_after: 六、国考省考申论面试怎么用
      context_after: 这类题最容易写成“扩大保障范围、提高理赔效率、加强宣传培训”三句话。方向没错，但缺少制度链条。可以直接使用这套公式：**责任随单落实+风险前端预防+报案一次提交
    - id: fig-89-11
      before_heading: '## 金句集合'
      inline_marker: '![第89篇配图11](media/images/2026-08-30-article-89/fig-89-11.png)'
      anchor_before: 岗位可以灵活，保障不能失联；工作可以按单发生，责任不能等事故发生后才出现。
      anchor_after: 金句集合
      context_after: 1.职业伤害保障的完整逻辑是：订单触发保障、风险前置预防、一键报案、协同认定、分类理赔、康复救济。2.按单缴费解决的不仅是一个计算方法，更是让保障责任跟得上流动
    - id: fig-89-12
      before_heading: '## 参考文章'
      inline_marker: '![第89篇配图12](media/images/2026-08-30-article-89/fig-89-12.png)'
