    items:
    - id: fig-85-01
      before_heading: '## 一、先解决“能不能”：消费能力来自稳定收入，而非临时优惠'
      inline_marker: '![第85篇配图01](media/images/2026-08-24-article-85/fig-85-01.png)'
      anchor_before: 85｜《人民日报》谈提振消费：让群众能消费、敢消费、愿消费，要补哪四块短板？
      anchor_after: 在申论中写“提振消费”，很多答案会迅速进入活动策划模式：
      context_after: 消费券能让一件商品便宜几十元，但稳定就业才决定了一个家庭在未来几个月、甚至几年里是否拥有持续的购买能力。《如何推动能消费敢消费愿消费》一文清晰地指出了“能消费”
    - id: fig-85-02
      before_heading: '## 一、先解决“能不能”：消费能力来自稳定收入，而非临时优惠'
      inline_marker: '![第85篇配图02](media/images/2026-08-24-article-85/fig-85-02.png)'
      anchor_before: 他们会先判断收入是否稳定，再考虑未来的养老、医疗、育幼、住房等支出；在有能力且有预期之后，还会看市场上有没有合适的产品和服务；准备下单时，又会评估质量、价格、退换货和维权风险。
      anchor_after: 通读《人民日报》1月份的这组消费报道，可以将提振消费的基础概括为四块：
      context_after: 消费券能让一件商品便宜几十元，但稳定就业才决定了一个家庭在未来几个月、甚至几年里是否拥有持续的购买能力。《如何推动能消费敢消费愿消费》一文清晰地指出了“能消费”
    - id: fig-85-04
      before_heading: '## 一、先解决“能不能”：消费能力来自稳定收入，而非临时优惠'
      inline_marker: '![第85篇配图04](media/images/2026-08-24-article-85/fig-85-04.png)'
      anchor_before: 这四块不是四项并列的活动，而是一项消费决策依次经过的四道门槛。任何一处卡住，潜在需求都可能停留在购物车里。
      anchor_after: 一、先解决“能不能”：消费能力来自稳定收入，而非临时优惠
      context_after: 消费券能让一件商品便宜几十元，但稳定就业才决定了一个家庭在未来几个月、甚至几年里是否拥有持续的购买能力。《如何推动能消费敢消费愿消费》一文清晰地指出了“能消费”
    - id: fig-85-05
      before_heading: '## 二、再解决“敢不敢”：社会保障稳住的，是家庭对未来的预期'
      inline_marker: '![第85篇配图05](media/images/2026-08-24-article-85/fig-85-05.png)'
      anchor_before: 有了收入，消费就一定会增加吗？还不够。家庭考虑的是长期的收支平衡，而非某个月的钱包余额。
      anchor_after: 二、再解决“敢不敢”：社会保障稳住的，是家庭对未来的预期
      context_after: 一个家庭即使当前收入尚可，但只要担心老人患病无人照护、孩子托育费用过高，或者住房、教育支出存在较大不确定性，就会为未来预留更多资金。表面看是“消费意愿不强”，实
    - id: fig-85-06
      before_heading: '## 三、接住“愿不愿”：有了需求，还要有适配的供给'
      inline_marker: '![第85篇配图06](media/images/2026-08-24-article-85/fig-85-06.png)'
      anchor_before: 在“能消费”和“敢消费”之后，需求还需要市场来承接。否则，即使群众有购买能力，也可能找不到距离合适、质量可靠、体验良好的产品和服务。
      anchor_after: 三、接住“愿不愿”：有了需求，还要有适配的供给
      context_after: 我国的消费结构正在发生变化。以2025年为例，服务性消费支出占居民人均消费支出的比重为46.1%，服务零售额同比增长5.5%。这些数字虽然对应特定年份，却清晰地
    - id: fig-85-07
      before_heading: '## 四、守住“放不放心”：价格、质量和售后，本身就是消费成本'
      inline_marker: '![第85篇配图07](media/images/2026-08-24-article-85/fig-85-07.png)'
      anchor_before: 不过，供给适配只能让人产生购买意愿。要让一次尝试变成持续消费，还需解决最后一块拼图：交易是否值得信任。
      anchor_after: 四、守住“放不放心”：价格、质量和售后，本身就是消费成本
      context_after: 消费者购买一件商品或预订一项服务，所支付的远不止标价。如果担心商家宣传夸大其词、小字免责，担心预付后商家关门跑路，担心退货必须回到原店，担心投诉被反复转办，那么
    - id: fig-85-08
      before_heading: '## 五、从一次刺激到长期循环：让数据、物流和公共服务一起运转'
      inline_marker: '![第85篇配图08](media/images/2026-08-24-article-85/fig-85-08.png)'
      anchor_before: 即便补齐了上述四块短板，工作也远未结束。居民的需求会变化，产品和服务也会迭代，提振消费还需要一套能够持续调整的连接机制。
      anchor_after: 五、从一次刺激到长期循环：让数据、物流和公共服务一起运转
      context_after: 《提振消费，如何增强供需适配性》提出了一个重要概念：供需适配。它远不止于企业做一次市场调查，或由政府列一份热销产品目录。供需适配需要一条能够持续运转的反馈链条。
    - id: fig-85-09
      before_heading: '## 七、结尾：消费的底气，来自更好的生活'
      inline_marker: '![第85篇配图09](media/images/2026-08-24-article-85/fig-85-09.png)'
      anchor_before: 信任问：信息、质量、退换、预付和维权风险是否压低了消费信心？
      anchor_after: 申论可用表达
      context_after: 消费不是一道要求群众“多花钱”的动员题。对个人和家庭而言，它是收入、保障、需求与信任共同作用后的生活选择；对经济运行而言，它又会把需求信号传回生产、投资和就业环
    - id: fig-85-10
      before_heading: '## 金句集合'
      inline_marker: '![第85篇配图10](media/images/2026-08-24-article-85/fig-85-10.png)'
      anchor_before: 只有把这四块基础接牢，消费增长才不会只是一时热闹，而会成为生活改善与经济循环相互促进的良性结果。
      anchor_after: 金句集合
      context_after: '```text1.提振消费不能只研究怎样促成一次交易，还要回答居民为什么愿意持续消费。2.就业增收托住消费能力，社会保障稳定未来预期，优质供给承接真实需求，权益'
    - id: fig-85-11
      before_heading: '## 参考文章'
      inline_marker: '![第85篇配图11](media/images/2026-08-24-article-85/fig-85-11.png)'
      anchor_before: 消费的底气，最终来自稳定的收入、可靠的保障、优质的供给和可信的规则。
