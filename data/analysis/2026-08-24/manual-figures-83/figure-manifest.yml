    - id: fig-83-01
      before_heading: '## 一、清事项：基层减负先要回答“谁该干”，不能笼统地说“少干”'
      inline_marker: '![第83篇配图01](media/images/2026-08-24-article-83/fig-83-01.png)'
      anchor_before: 83｜人民日报谈基层减负：不是简单少干活，而是要把权责、资源和能力一并配齐
      anchor_after: 在申论中写“为基层减负”，很多同学会立刻列出一系列措施：精简文件会议、减少报表、压缩检查、整治指尖上的形式主义。
      context_after: 基层离群众最近，能够最早发现问题，这是治理优势。但离现场近，不等于拥有全部执法权、专业资质、数据权限和财政资源。如果只用一句“属地负责”，就把安全生产、市场监管
    - id: fig-83-02
      before_heading: '## 一、清事项：基层减负先要回答“谁该干”，不能笼统地说“少干”'
      inline_marker: '![第83篇配图02](media/images/2026-08-24-article-83/fig-83-02.png)'
      anchor_before: 表面上负担减轻了，实际上可能只是换了一种负担，甚至把负担从基层转移给了群众。
      anchor_after: 通读《人民日报》关于基层减负的一组报道，会发现这项工作的完整逻辑并非“让基层少干一点”，而是把不该基层承担的事务挡在外面，把该基层承担的责任说清楚，再把完成责任所需的条件配到位。
      context_after: 基层离群众最近，能够最早发现问题，这是治理优势。但离现场近，不等于拥有全部执法权、专业资质、数据权限和财政资源。如果只用一句“属地负责”，就把安全生产、市场监管
    - id: fig-83-03
      before_heading: '## 一、清事项：基层减负先要回答“谁该干”，不能笼统地说“少干”'
      inline_marker: '![第83篇配图03](media/images/2026-08-24-article-83/fig-83-03.png)'
      anchor_before: 这五个步骤依次回答了五个问题：谁该干？新任务能不能派？凭什么干？会不会干？干得值不值？
      anchor_after: 一、清事项：基层减负先要回答“谁该干”，不能笼统地说“少干”
      context_after: 基层离群众最近，能够最早发现问题，这是治理优势。但离现场近，不等于拥有全部执法权、专业资质、数据权限和财政资源。如果只用一句“属地负责”，就把安全生产、市场监管
    - id: fig-83-04
      before_heading: '## 二、禁摊派：不只要有事项清单，还要管住新任务从哪里进来'
      inline_marker: '![第83篇配图04](media/images/2026-08-24-article-83/fig-83-04.png)'
      anchor_before: 不过，清单划清的是存量责任。如果任何部门都可以临时加任务、越过程序直接派单，再清楚的边界也会被重新冲破。
      anchor_after: 二、禁摊派：不只要有事项清单，还要管住新任务从哪里进来
      context_after: 基层负担往往不是一次性形成的。今天多报一张表，明天多建一个群，后天多承担一项宣传任务。每个部门单看自己的要求，都觉得任务不重。但当几十条线同时落到一个乡镇、一个
    - id: fig-83-05
      before_heading: '## 三、配资源：任务下沉不能只带责任，还要带着权限、资金、人员和专业力量'
      inline_marker: '![第83篇配图05](media/images/2026-08-24-article-83/fig-83-05.png)'
      anchor_before: 任务确有必要下沉，并不等于一纸文件下发就算完成赋能。下一步要问的是：基层靠什么把事情办成？
      anchor_after: 三、配资源：任务下沉不能只带责任，还要带着权限、资金、人员和专业力量
      context_after: 基层治理中有两类看似相反、实则同源的问题。一类是“有责无权”：基层负责最终结果，却没有执法权和调度权。另一类是“有权无能”：某项权力下放了，但基层没有专业人员、
    - id: fig-83-06
      before_heading: '## 四、强能力：基层本领不是靠“大水漫灌”长出来的，要在真实场景中练出来'
      inline_marker: '![第83篇配图06](media/images/2026-08-24-article-83/fig-83-06.png)'
      anchor_before: 一类是“有责无权”：基层负责最终结果，却没有执法权和调度权。另一类是“有权无能”：某项权力下放了，但基层没有专业人员、检测设备、专项预算和技术标准，仍然无法依法履职。
      anchor_after: 云南曲靖沾益区的林草执法案例很典型。区级部门下放了执法权，但乡镇没有具备资质的测绘评估人员，无法出具合法有效的评估报告；委托第三方机构又缺少专项预算。立案难以作出规范处罚，不立案又可能面临问责。
      context_after: 减负之后，基层干部有了更多时间，但服务需求并不会自动变简单。产业发展、矛盾调解、风险排查、数字治理等领域不断出现新情况。仅凭老经验和责任心，可能好心办不成事，甚
    - id: fig-83-07
      before_heading: '## 四、强能力：基层本领不是靠“大水漫灌”长出来的，要在真实场景中练出来'
      inline_marker: '![第83篇配图07](media/images/2026-08-24-article-83/fig-83-07.png)'
      anchor_before: 条件配齐以后，还要避免另一个误区：以为给基层上几次课、发几本手册，就算完成了能力建设。
      anchor_after: 四、强能力：基层本领不是靠“大水漫灌”长出来的，要在真实场景中练出来
      context_after: 减负之后，基层干部有了更多时间，但服务需求并不会自动变简单。产业发展、矛盾调解、风险排查、数字治理等领域不断出现新情况。仅凭老经验和责任心，可能好心办不成事，甚
    - id: fig-83-08
      before_heading: '## 五、看成效：既看基层是否少空转，更看群众是否少跑腿、问题是否真解决'
      inline_marker: '![第83篇配图08](media/images/2026-08-24-article-83/fig-83-08.png)'
      anchor_before: 权责清了，资源到了，能力强了，最后还要回答一个问题：基层减负究竟怎样才算有效？
      anchor_after: 五、看成效：既看基层是否少空转，更看群众是否少跑腿、问题是否真解决
      context_after: 基层减负最容易出现的偏差，是把“减了多少”当成全部成绩。少开多少会、少填多少表、少挂多少牌，这些当然可以统计。但它们只是过程指标。更应关注的，是基层干部能否把时
    - id: fig-83-10
      before_heading: '## 六、申论课堂怎么迁移：把“为基层减负”写成一套履职条件配置机制'
      inline_marker: '![第83篇配图10](media/images/2026-08-24-article-83/fig-83-10.png)'
      anchor_before: 这提醒我们，事项退出时必须回答“谁来接”。能够通过部门数据核验的，就不要让群众重复证明；需要线下办理的，应下沉表格、设置帮办或明确一次告知；社区依法不能出具的材料，也要说明替代路径，不能只说“不归我管”。
      anchor_after: 评价基层减负，可以看四本账：
      context_after: 以后遇到基层减负、小马拉大车、履职清单、数字形式主义、督查检查等题目，可以先使用“五问法”进行判断：-**职责问**：这件事依法该由谁承担？基层是主责还是配合？
    - id: fig-83-09
      before_heading: '## 六、申论课堂怎么迁移：把“为基层减负”写成一套履职条件配置机制'
      inline_marker: '![第83篇配图09](media/images/2026-08-24-article-83/fig-83-09.png)'
      anchor_before: 减负成效不能只看基层少做了什么，还要看部门多承担了什么、群众多获得了什么、治理多解决了什么。
