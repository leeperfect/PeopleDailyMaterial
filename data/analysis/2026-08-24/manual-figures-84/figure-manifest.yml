plans:
  shared:
    items:
    - id: fig-84-01
      before_heading: '## 一、规划定方向：不是把国家任务原样复制到每个地方'
      inline_marker: '![第84篇配图01](media/images/2026-08-24-article-84/fig-84-01.png)'
      anchor_before: 84｜《人民日报》谈“十五五”开局：内需、创新、民生与风险应形成闭环
      anchor_after: 面对“十五五”开局，很多同学的第一反应是把规划里的关键词都列出来：
      context_after: 规划首先要回答未来五年向哪里走、靠什么发展、最终为了谁。《人民日报》开年报道从科技创新、高质量发展写到民生保障和开放合作，其中贯穿始终的标尺是：发展要有质量，进
    - id: fig-84-02
      before_heading: '## 一、规划定方向：不是把国家任务原样复制到每个地方'
      inline_marker: '![第84篇配图02](media/images/2026-08-24-article-84/fig-84-02.png)'
      anchor_before: 规划的落地，不是从一个长清单变成更长的清单。
      anchor_after: 通读《人民日报》关于2026年经济工作的系列报道，可以将“十五五”开局提炼为一条更清晰的执行链：
      context_after: 规划首先要回答未来五年向哪里走、靠什么发展、最终为了谁。《人民日报》开年报道从科技创新、高质量发展写到民生保障和开放合作，其中贯穿始终的标尺是：发展要有质量，进
    - id: fig-84-03
      before_heading: '## 一、规划定方向：不是把国家任务原样复制到每个地方'
      inline_marker: '![第84篇配图03](media/images/2026-08-24-article-84/fig-84-03.png)'
      anchor_before: 这五个步骤不能拆成互不相干的分论点。它们连在一起，才是一件事从“应该干”到“干成了”的完整过程。
      anchor_after: 一、规划定方向：不是把国家任务原样复制到每个地方
      context_after: 规划首先要回答未来五年向哪里走、靠什么发展、最终为了谁。《人民日报》开年报道从科技创新、高质量发展写到民生保障和开放合作，其中贯穿始终的标尺是：发展要有质量，进
    - id: fig-84-04
      before_heading: '## 二、年度抓重点：不是每个领域平均用力，而是围绕主要矛盾破题'
      inline_marker: '![第84篇配图04](media/images/2026-08-24-article-84/fig-84-04.png)'
      anchor_before: 方向确定后，不能马上把所有任务都铺开。第一年的资源和精力有限，下一步必须从众多目标中，筛出最能打开局面的任务。
      anchor_after: 二、年度抓重点：不是每个领域平均用力，而是围绕主要矛盾破题
      context_after: 开局要有声势，更要有章法。《沉下心来抓落实、办实事》将问题分为两类：短期能解决的，立刻办理；一时难以解决的，循序渐进、持续发力。例如，北京“接诉即办”对突发事件
    - id: fig-84-06
      before_heading: '## 三、项目政策承接：把部署拆成“建什么、改什么、服务谁”'
      inline_marker: '![第84篇配图06](media/images/2026-08-24-article-84/fig-84-06.png)'
      anchor_before: 所谓牵引性任务，就是找准那个一旦打通，就能让多个环节联动起来的堵点。
      anchor_after: 开局的“开”，不是把所有任务一次铺开，而是用一两项牵引性任务把局面打开。
      context_after: 战略任务落地，并非只有“上项目”这一种方式。更完整的承接方式，至少有三类：1.**项目建设**：解决基础设施、公共服务设施、生产设备和生态修复等硬件短板。2.*
    - id: fig-84-05
      before_heading: '## 三、项目政策承接：把部署拆成“建什么、改什么、服务谁”'
      inline_marker: '![第84篇配图05](media/images/2026-08-24-article-84/fig-84-05.png)'
      anchor_before: 重点筛选出来后，它仍然是一个抽象目标。要从“抓好”“加强”“推进”走向可执行的任务，必须找到具体的载体。
      anchor_after: 三、项目政策承接：把部署拆成“建什么、改什么、服务谁”
      context_after: 战略任务落地，并非只有“上项目”这一种方式。更完整的承接方式，至少有三类：1.**项目建设**：解决基础设施、公共服务设施、生产设备和生态修复等硬件短板。2.*
    - id: fig-84-07
      before_heading: '## 四、责任资源匹配：不能只把任务定到人，却把履职条件留在纸上'
      inline_marker: '![第84篇配图07](media/images/2026-08-24-article-84/fig-84-07.png)'
      anchor_before: 但列出清单并不意味着任务会自动执行。接下来还要解决一个最现实的问题：谁来干，凭什么干？
      anchor_after: 四、责任资源匹配：不能只把任务定到人，却把履职条件留在纸上
      context_after: 不少年度计划看起来很具体：有牵头部门，有完成时限，有进度通报。但这些信息只说明了谁会被考核，还没有说明事情如何才能办成。一项任务能否执行，至少要看八项内容是否配
    - id: fig-84-08
      before_heading: '## 五、民生风险校验：既要看带来了什么，也要看留下了什么'
      inline_marker: '![第84篇配图08](media/images/2026-08-24-article-84/fig-84-08.png)'
      anchor_before: 责任和资源配齐了，年度任务才具备启动条件。但项目进度快、投资规模大，仍不能自动证明开局开得好。最后还要经过两道校验。
      anchor_after: 五、民生风险校验：既要看带来了什么，也要看留下了什么
      context_after: 第一道是民生校验。《坚持民生为大，努力为人民群众多办实事》将就业、社会保障和身边公共服务放在同等重要的位置。2025年1至11月，全国城镇新增就业1210万人；
    - id: fig-84-10
      before_heading: '## 六、申论课堂怎么迁移：用“五问法”把宏观规划转成执行方案'
      inline_marker: '![第84篇配图10](media/images/2026-08-24-article-84/fig-84-10.png)'
      anchor_before: 民生校验防止发展离人太远，风险校验防止开局跑得太急。两道考试都通过，开局才既有力度，又有后劲。
      anchor_after: 六、申论课堂怎么迁移：用“五问法”把宏观规划转成执行方案
      context_after: 遇到“规划落地”“开局起步”“重点项目”“抓落实”等题目，可以用五个问题快速搭建答案：1.**定位问**：这项任务与国家战略、地方功能定位和发展阶段是什么关系？
    - id: fig-84-11
      before_heading: '## 七、结尾：好的开局，不是铺得最开，而是第一步走得最稳'
      inline_marker: '![第84篇配图11](media/images/2026-08-24-article-84/fig-84-11.png)'
      anchor_before: 推动“十五五”开好局、起好步，应坚持大局定位与问题导向相结合，围绕制约高质量发展的主要矛盾和群众急难愁盼，筛选牵引性强、成熟度高、综合效益好的年度任务；将战略部署分解为项目建设、政策改革和公共服务安排，并配套牵头主体、完成时限、资金要素和协同机制；以就业、收入、公共服务和群众感受检验发展成效，以债务、生态和安全底线校准
      anchor_after: 课堂情境题
      context_after: 五年规划解决长远和全局问题，开局之年解决起步和突破问题。两者之间并非简单的任务分割，而是一次从战略语言向执行语言的转换。首先，要在大局中找准定位，用主要矛盾来确
    - id: fig-84-12
      before_heading: '## 金句集合'
      inline_marker: '![第84篇配图12](media/images/2026-08-24-article-84/fig-84-12.png)'
      anchor_before: 开局不必急于将盘子铺大。关键在于找准那个最能打开局面的问题，将政策、项目、责任和资源紧密衔接，让群众看到切实变化，同时不给未来留下难以承受的风险。这样的第一步，才能为未来五年奠定稳固的基础。
      anchor_after: 金句集合
      context_after: '```text1.规划落地，不是从一个长清单走向更长的清单，而是从战略方向走向年度选择和可验证的结果。2.战略定向、矛盾筛选、项目承接、责任配资、双重校验，构成'
    - id: fig-84-14
      before_heading: '## 参考文章'
      inline_marker: '![第84篇配图14](media/images/2026-08-24-article-84/fig-84-14.png)'
      anchor_before: 好的开局不是盘子铺得最大，而是第一步找得准、资源配得齐、结果站得稳。
      anchor_after: 参考文章
      context_after: 1.周輖等：《为共赴“十五五”新征程凝聚奋进力量》，2026年1月1日，第04版。2.杨旭：《沉下心来抓落实、办实事（“十五五”开好局起好步）》，2026年1月
