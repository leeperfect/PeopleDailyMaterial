plans:
  shared:
    items:
    - id: fig-79-01
      before_heading: '## 第一关：为谁干——先问群众得到什么，也要问群众承担什么'
      inline_marker: '![第79篇配图01](media/images/2026-08-20-article-79/fig-79-01.png)'
      anchor_before: 79｜人民日报用164篇文章讲透政绩观：从“想干事”到“干成正确的事”，中间隔着六道关
      anchor_after: 写“正确政绩观”，最容易得到的答案是三句话：为民造福、真抓实干、久久为功。
      context_after: 政绩观的第一个问题，不是“干得快不快”，而是“这件事究竟为了谁”。《树立和践行正确政绩观，起决定性作用的是党性》把根子落在党性上。党性之所以决定政绩观，是因为它
    - id: fig-79-02
      before_heading: '## 第一关：为谁干——先问群众得到什么，也要问群众承担什么'
      inline_marker: '![第79篇配图02](media/images/2026-08-20-article-79/fig-79-02.png)'
      anchor_before: 面对这些问题，只再说一遍“树立正确政绩观”，解释不了偏差究竟出在哪里。
      anchor_after: 为了把它说清，我把今年《人民日报》文章重新过了一遍。截至2026年8月20日，找到跟政绩观相关的164篇实质性文章。164篇文章放在一起看，能看到一条非常清楚的变化轨迹。
      context_after: 政绩观的第一个问题，不是“干得快不快”，而是“这件事究竟为了谁”。《树立和践行正确政绩观，起决定性作用的是党性》把根子落在党性上。党性之所以决定政绩观，是因为它
    - id: fig-79-03
      before_heading: '## 第一关：为谁干——先问群众得到什么，也要问群众承担什么'
      inline_marker: '![第79篇配图03](media/images/2026-08-20-article-79/fig-79-03.png)'
      anchor_before: 从“想干事”到“干成正确的事”，中间至少隔着这六道关。
      anchor_after: 第一关：为谁干——先问群众得到什么，也要问群众承担什么
      context_after: 政绩观的第一个问题，不是“干得快不快”，而是“这件事究竟为了谁”。《树立和践行正确政绩观，起决定性作用的是党性》把根子落在党性上。党性之所以决定政绩观，是因为它
    - id: fig-79-04
      before_heading: '## 第二关：干什么——不是所有增长、项目和排名，都能叫政绩'
      inline_marker: '![第79篇配图04](media/images/2026-08-20-article-79/fig-79-04.png)'
      anchor_before: 为民造福，不是干部替群众定义幸福，而是把群众的真实需要转化为公共行动。
      anchor_after: 第二关：干什么——不是所有增长、项目和排名，都能叫政绩
      context_after: 方向对了，还要选择正确的事。《坚持高质量发展要成为领导干部政绩观的重要内容》提醒我们，政绩观和发展观是连在一起的。若仍把规模扩张、投资增速、项目数量和短期排名当
    - id: fig-79-05
      before_heading: '## 第三关：怎么定——好心、用力和坚决，都不能替代按规律办事'
      inline_marker: '![第79篇配图05](media/images/2026-08-20-article-79/fig-79-05.png)'
      anchor_before: 第二关要回答的，是这项工作究竟服务于什么发展目标。只追求“能被看见”，容易制造工程；只强调“以后会见效”，又可能逃避检验。正确的做法，是让当期改善和长远基础相互支撑。
      anchor_after: 第三关：怎么定——好心、用力和坚决，都不能替代按规律办事
      context_after: 目标选对了，办法仍然可能走偏。《决策责任沉甸甸》讲过一个反差鲜明的案例：西北某县不顾当地条件，引进外地养驴产业，最后水土不服；上海崇明立足生态岛定位，福建沙县围
    - id: fig-79-06
      before_heading: '## 第四关：谁负责——真正的担当，要落在难题、旧账和时间上'
      inline_marker: '![第79篇配图06](media/images/2026-08-20-article-79/fig-79-06.png)'
      anchor_before: 第三关检验的，正是干部能否在“我想干”和“这件事该不该这样干”之间，保留对实际、规律和风险的敬畏。
      anchor_after: 第四关：谁负责——真正的担当，要落在难题、旧账和时间上
      context_after: 决策通过之后，政绩开始进入最考验人的部分：落实。《敢啃“硬骨头”方能创造“硬政绩”》提出，硬骨头往往位于矛盾体系的核心位置。它们难办、耗时、牵涉面广，短期不容易
    - id: fig-79-07
      before_heading: '## 第五关：怎么验——数据要说真话，考核要看见差异和长效'
      inline_marker: '![第79篇配图07](media/images/2026-08-20-article-79/fig-79-07.png)'
      anchor_before: 所以，硬政绩并不是声势更大，而是对主要矛盾抓得更准，对复杂问题盯得更久，对群众承诺接得更稳。
      anchor_after: 第五关：怎么验——数据要说真话，考核要看见差异和长效
      context_after: 工作做完了，谁来判断它是不是政绩？最常见的答案是数据。但《数据必须实打实》提醒，数据应当反映工作，不能代替工作。为了排名而“造数字”，围着指标“追数字”，把报表
    - id: fig-79-08
      before_heading: '## 第六关：如何稳——不能只靠某个干部“想明白了”'
      inline_marker: '![第79篇配图08](media/images/2026-08-20-article-79/fig-79-08.png)'
      anchor_before: 政绩验收因此不能只有一个数字，也不能只在一个时间点完成。它应当把定量与定性、当前与长远、组织评价与群众评价、结果与过程结合起来。
      anchor_after: 第六关：如何稳——不能只靠某个干部“想明白了”
      context_after: 到这里，正确政绩观似乎已经完整：方向对、决策准、落实实、评价真。但还有最后一个问题：换了干部怎么办？考核口径变了怎么办？一轮集中整改结束后，问题会不会重新出现？
    - id: fig-79-09
      before_heading: '## 把六道关带进国考省考的申论和面试'
      inline_marker: '![第79篇配图09](media/images/2026-08-20-article-79/fig-79-09.png)'
      anchor_before: 正确政绩观既要成为干部心里的尺度，也要成为组织运行的规则。
      anchor_after: 把六道关带进国考省考的申论和面试
      context_after: 今后遇到政绩观、干部担当、高质量发展、基层治理、项目建设、考核评价等题目，可以先别急着罗列“提高认识、加强监管、完善机制”。先用六个问题检查材料：1.这件事是谁
    - id: fig-79-10
      before_heading: '## 金句集合'
      inline_marker: '![第79篇配图10](media/images/2026-08-20-article-79/fig-79-10.png)'
      anchor_before: 想干事，只说明有愿望；把事干成，只说明有能力；把正确的事用正确的方法干成，并让结果真正造福人民、经得起长远检验，才叫政绩。
      anchor_after: 金句集合
      context_after: '```text1.正确政绩观不是干部应当保持什么态度，而是一项工作从起念、选择、决策、执行，到验收和延续的全过程。2.从“想干事”到“干成正确的事”，要经过人民'
