    - id: fig-78-04
      before_heading: '## 一、理念入规划：健康不是医疗政策的附录，而是发展政策的约束条件'
      inline_marker: '![第78篇配图04](media/images/2026-08-20-article-78/fig-78-04.png)'
      anchor_before: 78｜人民日报谈健康优先：不是卫生部门“单打独斗”，而是要将预防融入学校、社区和日常生活
      anchor_after: 在申论中写“健康中国”，很多答案会迅速落到三件事上：建医院、添设备、引人才。
      context_after: '**健康优先，首先要改变公共决策看问题的起点。**多办几场讲座，只是其中很小的一部分。过去讨论卫生健康，常常把工作简化为医疗资源的配置：医院够不够、床位多不多、'
    - id: fig-78-03
      before_heading: '## 一、理念入规划：健康不是医疗政策的附录，而是发展政策的约束条件'
      inline_marker: '![第78篇配图03](media/images/2026-08-20-article-78/fig-78-03.png)'
      anchor_before: 这些当然重要。但如果文章只写到这里，健康就仍然只是医疗系统末端的一道题：人已经生病了，再想办法把病治好。
      anchor_after: 真正的“健康优先”，要把问题往前追溯。孩子近视、肥胖、心理压力增大，不能只等医院诊治，还要看学校的课程设置、体育活动、膳食安排和家庭支持；慢性病高发，不能只增加专科床位，还要改变饮食结构、运动习惯、控烟措施和健康管理；传染病风险出现，不能只靠医院收治，还要依靠监测预警、疫苗接种、基层响应和社会参与；网络伪科普误导群众，
      context_after: '**健康优先，首先要改变公共决策看问题的起点。**多办几场讲座，只是其中很小的一部分。过去讨论卫生健康，常常把工作简化为医疗资源的配置：医院够不够、床位多不多、'
    - id: fig-78-02
      before_heading: '## 一、理念入规划：健康不是医疗政策的附录，而是发展政策的约束条件'
      inline_marker: '![第78篇配图02](media/images/2026-08-20-article-78/fig-78-02.png)'
      anchor_before: 真正的“健康优先”，要把问题往前追溯。孩子近视、肥胖、心理压力增大，不能只等医院诊治，还要看学校的课程设置、体育活动、膳食安排和家庭支持；慢性病高发，不能只增加专科床位，还要改变饮食结构、运动习惯、控烟措施和健康管理；传染病风险出现，不能只靠医院收治，还要依靠监测预警、疫苗接种、基层响应和社会参与；网络伪科普误导群众，
      anchor_after: 由此再看健康，它显然不只是卫生健康部门的业务结果。教育环境、社区治理、公共卫生、网络平台和每个人的日常选择，都在塑造居民的健康。
      context_after: '**健康优先，首先要改变公共决策看问题的起点。**多办几场讲座，只是其中很小的一部分。过去讨论卫生健康，常常把工作简化为医疗资源的配置：医院够不够、床位多不多、'
    - id: fig-78-01
      before_heading: '## 一、理念入规划：健康不是医疗政策的附录，而是发展政策的约束条件'
      inline_marker: '![第78篇配图01](media/images/2026-08-20-article-78/fig-78-01.png)'
      anchor_before: 也可以记成四个转变：从治病到健康，从医院到日常，从部门到社会，从投入到结果。
      anchor_after: 一、理念入规划：健康不是医疗政策的附录，而是发展政策的约束条件
      context_after: '**健康优先，首先要改变公共决策看问题的起点。**多办几场讲座，只是其中很小的一部分。过去讨论卫生健康，常常把工作简化为医疗资源的配置：医院够不够、床位多不多、'
    - id: fig-78-05
      before_heading: '## 二、风险早识别：预防不是泛泛提醒，而是把干预窗口往前移'
      inline_marker: '![第78篇配图05](media/images/2026-08-20-article-78/fig-78-05.png)'
      anchor_before: 理念进入规划后，下一步就要改变资源投向：不能总在疾病发生后追赶，而要在风险形成前识别和干预。
      anchor_after: 二、风险早识别：预防不是泛泛提醒，而是把干预窗口往前移
      context_after: “预防为主”写进文章并不难，难的是写清楚怎样预防。有效预防至少要接上四个动作：**发现信号、识别风险、分类干预、持续随访。**少了任何一环，预防都可能停在宣传口
    - id: fig-78-06
      before_heading: '## 三、服务进场景：健康不能只在医院里发生，还要进入学校、社区和信息环境'
      inline_marker: '![第78篇配图06](media/images/2026-08-20-article-78/fig-78-06.png)'
      anchor_before: 风险被识别后，还要有人在日常生活中接住。否则，预防服务离群众再近，也可能只停在一张通知上。
      anchor_after: 三、服务进场景：健康不能只在医院里发生，还要进入学校、社区和信息环境
      context_after: '**人的健康状况，大部分并非在医院里形成，而是在课堂、家庭、社区、工作场所和网络空间中逐渐塑造的。**因此，健康优先的第三步，是将专业服务嵌入真实的生活场景。#'
    - id: fig-78-08
      before_heading: '## 四、部门共担责：协同不是一起签文件，而是把责任、数据和行动接起来'
      inline_marker: '![第78篇配图08](media/images/2026-08-20-article-78/fig-78-08.png)'
      anchor_before: 医院擅长解决一次诊疗，社区更适合做好长期陪伴；二者上下联通，才能把预防、治疗和康复接成全周期服务。
      anchor_after: 网络空间不能只追求“有内容”，还要让权威信息跑得过伪科普
      context_after: 健康优先必然是一道跨部门治理题。传染病防控涉及卫生健康、疾控、发展改革、财政、农业农村、海关和中医药等部门；残疾预防覆盖婚育保健、儿童筛查、慢病防治、安全生产、
    - id: fig-78-09
      before_heading: '## 四、部门共担责：协同不是一起签文件，而是把责任、数据和行动接起来'
      inline_marker: '![第78篇配图09](media/images/2026-08-20-article-78/fig-78-09.png)'
      anchor_before: 如果群众每天接触的都是夸大风险和虚假疗效的信息，那么即便拥有再多健康知识，也可能被错误信息所抵消。提升健康素养，一方面要帮助群众提高辨别能力，另一方面要增加权威内容的供给，核验专业账号的资质，标注信息来源，追踪违规交易，并压实平台的责任。
      anchor_after: 学校、社区和网络空间看似分散，但背后的逻辑是一致的：服务要跟着健康影响因素走，专业能力要进入风险真实发生的地方。
      context_after: 健康优先必然是一道跨部门治理题。传染病防控涉及卫生健康、疾控、发展改革、财政、农业农村、海关和中医药等部门；残疾预防覆盖婚育保健、儿童筛查、慢病防治、安全生产、
    - id: fig-78-07
      before_heading: '## 四、部门共担责：协同不是一起签文件，而是把责任、数据和行动接起来'
      inline_marker: '![第78篇配图07](media/images/2026-08-20-article-78/fig-78-07.png)'
      anchor_before: 但场景一多，最容易出现的新问题就是职责模糊：人人都说健康重要，最后却仍由卫生部门独自承担结果。
      anchor_after: 四、部门共担责：协同不是一起签文件，而是把责任、数据和行动接起来
      context_after: 健康优先必然是一道跨部门治理题。传染病防控涉及卫生健康、疾控、发展改革、财政、农业农村、海关和中医药等部门；残疾预防覆盖婚育保健、儿童筛查、慢病防治、安全生产、
    - id: fig-78-10
      before_heading: '## 五、结果进评价：不能只数医院、活动和筛查人次，还要看健康是否改善'
      inline_marker: '![第78篇配图10](media/images/2026-08-20-article-78/fig-78-10.png)'
      anchor_before: 在责任和流程衔接之后，还需要通过评价机制来纠偏。因为考核关注什么，资源就会流向什么，干部和机构也就会更重视什么。
      anchor_after: 五、结果进评价：不能只数医院、活动和筛查人次，还要看健康是否改善
      context_after: 健康工作很容易陷入“做了很多，效果却难以衡量”的困境。建了多少场馆、举办了多少讲座、完成了多少筛查、签约了多少家庭医生——这些数据便于统计，但主要反映的是投入和
    - id: fig-78-11
      before_heading: '## 六、国考省考申论和面试怎么迁移：把“健康中国”写成一套治理方法'
      inline_marker: '![第78篇配图11](media/images/2026-08-20-article-78/fig-78-11.png)'
      anchor_before: 健康优先最终不是看卫生部门做了多少事，而是看各领域的发展方式是否更有利于人的健康。
      anchor_after: 六、国考省考申论和面试怎么迁移：把“健康中国”写成一套治理方法
      context_after: 遇到健康中国、健康学校、慢性病防治、公共卫生、基层服务等题目，可以先判断材料卡在哪一环，再调用这套公式：>**理念入规划→风险早识别→服务进场景→部门共担责→结
    - id: fig-78-12
      before_heading: '## 金句集合'
      inline_marker: '![第78篇配图12](media/images/2026-08-20-article-78/fig-78-12.png)'
      anchor_before: 这便是“健康优先”的真正分量。
      anchor_after: 金句集合
      context_after: '```text1.教育环境、社区治理、公共卫生、网络平台乃至每个人的日常选择，都在塑造居民的健康。2.健康优先的完整链条是：理念入规划、风险早识别、服务进场景、'
