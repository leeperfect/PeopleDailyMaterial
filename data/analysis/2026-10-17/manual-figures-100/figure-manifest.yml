plans:
  shared:
    items:
    - id: 农户自选参与入口-1
      before_heading: '## 三、把收益写进具体约定，农户才知道凭什么领钱'
      inline_marker: '![](../../../media/images/article-inbox/农户自选参与入口-1.png)'
      anchor_before: 多元收益模式并不意味着每户都能同时拿到租金、分红和工资。同一项资源通过什么方式参与、对应哪笔收入，要按实际约定核对，不能重复计算。
      anchor_after: 三、把收益写进具体约定，农户才知道凭什么领钱
      context_after: 选好参与方式后，双方还得把具体条件谈清楚。杨玉梓的经历中，最能建立信任的细节，是收购车开进地头后，钱款当天到账。公司按约定收购，农户看到了兑现，才愿意扩大参与。
    - id: 杨家山里利润分层分配图-6
      before_heading: '## 五、把验收落到农户，现金、就业和服务分别看'
      inline_marker: '![](../../../media/images/article-inbox/杨家山里利润分层分配图-6.png)'
      anchor_before: 20%仅是该案例的约定，并非可照搬的统一比例。借鉴时应关注留存的目的、确定方式、说明与监督机制，以及剩余收益的分配安排。
      anchor_after: 留存需有明确用途和依据。在强调“为了长远发展”后，还得说清资金具体投向何处、经营账目如何；判断可分配金额，也不能仅看企业销售规模。
      context_after: 约定是否兑现，需回到农户处核实。企业销售额增长，反映的是经营规模的变化；村集体收入增加，体现的是集体可用资源的增多。但这两者都不能直接等同于某一户农民的实际收入
    - id: 保底收购风险与结算-13
      before_heading: '## 五、把验收落到农户，现金、就业和服务分别看'
      inline_marker: '![](../../../media/images/article-inbox/保底收购风险与结算-13.png)'
      anchor_before: 报道中的保底收购是特定协议安排，不代表整个经营过程无风险。能否按约兑现，仍取决于实际经营、履约能力及具体条件。不同项目的风险由谁承担，不能靠一句“共同受益”含糊带过。
      anchor_after: 五、把验收落到农户，现金、就业和服务分别看
      context_after: 约定是否兑现，需回到农户处核实。企业销售额增长，反映的是经营规模的变化；村集体收入增加，体现的是集体可用资源的增多。但这两者都不能直接等同于某一户农民的实际收入
    - id: 受益核验三方面-7
      before_heading: '## 六、国考省考申论面试怎么用'
      inline_marker: '![](../../../media/images/article-inbox/受益核验三方面-7.png)'
      anchor_before: 除了统计“带动了多少户”，还应抽取不同参与方式的家庭进行回访：种植户是否按约收到货款，务工者是否领到工资，资源参与户是否清楚结算依据。若有农户未受益，需查明原因是参与门槛、执行问题，还是项目缺乏持续经营能力。
      anchor_after: 六、国考省考申论面试怎么用
      context_after: 这组材料适用于乡村振兴、产业富民、集体经济和利益联结等主题。写作时，与其只泛泛而谈“延长产业链，带动农民增收”，不如具体说明农户如何参与、收益如何兑现。>**申
