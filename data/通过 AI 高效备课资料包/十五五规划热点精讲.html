<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>十五五规划热点精讲</title>
<style>
/* ===== 基础重置 ===== */
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif;background:#f5f0eb;color:#222;line-height:1.6;overflow-x:hidden;}

/* ===== 顶部栏 ===== */
.topbar{position:fixed;top:0;left:0;right:0;z-index:1000;background:linear-gradient(135deg,#8B0000 0%,#C00000 50%,#8B0000 100%);color:#fff;padding:10px 24px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 12px rgba(0,0,0,.25);}
.topbar h1{font-size:20px;font-weight:700;letter-spacing:2px;}
.topbar h1 span{color:#FFD700;font-weight:400;font-size:14px;margin-left:12px;letter-spacing:1px;}
.topbar-info{font-size:13px;opacity:.85;}
.topbar-info b{color:#FFD700;}

/* ===== 右侧浮动工具栏 ===== */
.float-toolbar{position:fixed;right:16px;top:50%;transform:translateY(-50%);z-index:1100;background:#fff;border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,.15);padding:8px;display:flex;flex-direction:column;gap:4px;border:1px solid #e0d6cc;transition:all .3s;}
.float-toolbar .tb-section{border-bottom:1px solid #f0e6dc;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;}
.float-toolbar .tb-section:last-child{border-bottom:none;}
.float-toolbar .tb-label{font-size:10px;color:#999;letter-spacing:1px;white-space:nowrap;text-align:center;line-height:1.2;}
.float-toolbar .tb-btn{width:36px;height:36px;border-radius:8px;border:1px solid #e0d6cc;background:#fff;color:#C00000;font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;user-select:none;}
.float-toolbar .tb-btn:hover{background:#FEF2F2;border-color:#C00000;}
.float-toolbar .tb-btn:active{transform:scale(.92);background:#FDEAEA;}
.float-toolbar .tb-value{font-size:13px;font-weight:700;color:#C00000;text-align:center;min-width:36px;line-height:1.2;}
.float-toolbar .tb-btn.reset{font-size:12px;color:#888;font-weight:600;}
.float-toolbar .tb-btn.reset:hover{color:#C00000;}

/* ===== 侧边导航 ===== */
.sidebar{position:fixed;top:52px;left:0;bottom:0;width:220px;background:#fff;border-right:1px solid #e0d6cc;overflow-y:auto;z-index:900;padding:8px 0;}
.sidebar::-webkit-scrollbar{width:4px;}
.sidebar::-webkit-scrollbar-thumb{background:#C00000;border-radius:2px;}
.nav-item{padding:8px 16px;font-size:13px;color:#555;cursor:pointer;border-left:3px solid transparent;transition:all .2s;display:flex;align-items:center;gap:6px;user-select:none;}
.nav-item:hover{background:#fef2f2;color:#C00000;}
.nav-item.active{background:#fef2f2;color:#C00000;border-left-color:#C00000;font-weight:600;}
.nav-item .num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:#f0e6dc;color:#8B4513;font-size:11px;font-weight:700;flex-shrink:0;}
.nav-item.active .num{background:#C00000;color:#fff;}
.nav-item .drag-handle{cursor:grab;color:#bbb;font-size:10px;margin-right:2px;}
.nav-item .drag-handle:active{cursor:grabbing;}

/* ===== 主内容区 ===== */
.main{margin-top:52px;margin-left:220px;padding:24px 70px 60px 32px;transition:padding .3s;}

/* ===== 幻灯片卡片 ===== */
.slide-card{background:#fff;border-radius:8px;box-shadow:0 1px 6px rgba(0,0,0,.08);margin-bottom:28px;overflow:hidden;transition:box-shadow .25s,transform .2s;border:1px solid #e8e0d8;}
.slide-card:hover{box-shadow:0 4px 20px rgba(0,0,0,.12);transform:translateY(-1px);}
.slide-card.dragging{opacity:.5;transform:rotate(1deg);}
.slide-card.drag-over{border-top:3px solid #C00000;}

.slide-header{background:linear-gradient(90deg,#C00000 0%,#a00000 100%);color:#fff;padding:16px 28px;display:flex;align-items:center;justify-content:space-between;}
.slide-header h2{font-size:20px;font-weight:700;letter-spacing:1px;}
.slide-header .slide-tag{background:rgba(255,255,255,.2);padding:2px 12px;border-radius:12px;font-size:12px;letter-spacing:1px;}
.slide-header .slide-time{font-size:13px;opacity:.8;}

.slide-body{padding:24px 28px;}

/* ===== 教学提示条 ===== */
.teach-tip{background:linear-gradient(90deg,#FFF8F0,#FFF3E0);border-left:4px solid #C49A2A;padding:12px 18px;margin:16px 0;border-radius:0 6px 6px 0;font-size:15px;color:#6B4226;line-height:1.7;}
.teach-tip::before{content:"💡 授课提示：";font-weight:700;color:#C49A2A;margin-right:4px;}

/* ===== 内容区块样式 ===== */
.content-block{margin:14px 0;}
.content-block h3{font-size:17px;color:#C00000;margin-bottom:8px;padding-bottom:4px;border-bottom:2px solid #F0D0A0;display:inline-block;}

/* 左右分栏 */
.two-col{display:flex;gap:20px;margin:12px 0;}
.two-col .col{flex:1;padding:16px;border-radius:8px;}
.col-left{background:#FEF7F0;border:1px solid #F0D8C0;}
.col-right{background:#F0F7F0;border:1px solid #C0D8B0;}
.col-label{font-size:13px;font-weight:700;color:#C00000;margin-bottom:8px;letter-spacing:1px;}
.col-right .col-label{color:#2E7D32;}

/* 金句框 */
.golden-box{background:linear-gradient(135deg,#FFFDE7,#FFF8E1);border:2px solid #C49A2A;border-radius:8px;padding:16px 20px;margin:14px 0;text-align:center;font-size:18px;font-weight:700;color:#8B4513;letter-spacing:1px;}

/* 数据卡片 */
.data-cards{display:flex;gap:16px;margin:14px 0;flex-wrap:wrap;}
.data-card{flex:1;min-width:200px;background:#fff;border:1px solid #e0d6cc;border-radius:8px;padding:16px;text-align:center;position:relative;}
.data-card .data-num{font-size:32px;font-weight:700;color:#C00000;line-height:1.2;}
.data-card .data-unit{font-size:14px;color:#888;}
.data-card .data-label{font-size:14px;color:#555;margin-top:4px;}
.data-card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#C00000,#C49A2A);border-radius:8px 8px 0 0;}

/* 真题标记 */
.exam-tag{display:inline-block;background:#E3F2FD;color:#1565C0;padding:2px 10px;border-radius:4px;font-size:13px;font-weight:600;margin:2px 0;}
.exam-item{padding:8px 14px;margin:6px 0;background:#FAFAFA;border-left:3px solid #1565C0;border-radius:0 6px 6px 0;font-size:15px;}

/* 反面示范 */
.wrong-box{background:#FFF0F0;border:1px solid #FFCDD2;border-radius:8px;padding:14px 18px;margin:8px 0;font-size:15px;}
.wrong-box::before{content:"❌ ";font-weight:700;}

/* 正面示范 */
.right-box{background:#F0FFF0;border:1px solid #C8E6C9;border-radius:8px;padding:14px 18px;margin:8px 0;font-size:15px;}
.right-box::before{content:"✅ ";font-weight:700;}

/* 递进步骤 */
.steps-row{display:flex;gap:12px;margin:16px 0;align-items:stretch;}
.step-box{flex:1;border-radius:8px;padding:16px;text-align:center;position:relative;min-height:80px;display:flex;flex-direction:column;justify-content:center;}
.step-box.step-red{background:#FDEAEA;border:2px solid #C00000;}
.step-box.step-gold{background:#FFF8E1;border:2px solid #C49A2A;}
.step-box.step-green{background:#E8F5E9;border:2px solid #2E7D32;}
.step-box .step-title{font-size:16px;font-weight:700;margin-bottom:4px;}
.step-box.step-red .step-title{color:#C00000;}
.step-box.step-gold .step-title{color:#8B6914;}
.step-box.step-green .step-title{color:#2E7D32;}
.step-box .step-desc{font-size:13px;color:#555;}
.step-arrow{display:flex;align-items:center;font-size:24px;color:#C49A2A;font-weight:700;flex-shrink:0;}

/* 练习区 */
.exercise-box{background:#F3E5F5;border:2px dashed #7B1FA2;border-radius:8px;padding:20px;margin:14px 0;}
.exercise-box h3{color:#7B1FA2;font-size:16px;margin-bottom:8px;}

/* 课后任务 */
.homework-list{list-style:none;padding:0;}
.homework-list li{padding:10px 14px;margin:6px 0;background:#FEF7F0;border-radius:6px;font-size:15px;border-left:4px solid #C00000;}
.homework-list li strong{color:#C00000;}

/* ===== 可调整大小的表格 ===== */
.table-wrapper{margin:12px 0;position:relative;background:#fff;}
.table-wrapper .table-toolbar{display:flex;align-items:center;justify-content:space-between;padding:4px 8px;background:#FAFAFA;border:1px solid #e0d6cc;border-bottom:none;border-radius:6px 6px 0 0;}
.table-toolbar .table-zoom-controls{display:flex;align-items:center;gap:4px;}
.table-toolbar .zoom-btn{width:28px;height:28px;border-radius:6px;border:1px solid #ddd;background:#fff;color:#C00000;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.table-toolbar .zoom-btn:hover{background:#FEF2F2;border-color:#C00000;}
.table-toolbar .zoom-btn:active{transform:scale(.9);}
.table-toolbar .zoom-val{font-size:12px;color:#C00000;font-weight:700;min-width:38px;text-align:center;}
.table-toolbar .table-hint{font-size:11px;color:#bbb;}

.table-scroll-area{overflow:auto;border:1px solid #e0d6cc;border-radius:0 0 6px 6px;resize:both;max-width:100%;min-height:60px;min-width:300px;max-height:500px;}
.table-scroll-area table{width:100%;border-collapse:collapse;font-size:15px;min-width:500px;}
.table-scroll-area th{background:linear-gradient(180deg,#C00000,#a00000);color:#fff;padding:10px 14px;text-align:left;font-size:14px;font-weight:600;white-space:nowrap;position:sticky;top:0;z-index:1;}
.table-scroll-area td{padding:9px 14px;border-bottom:1px solid #f0e6dc;font-size:14px;vertical-align:top;line-height:1.6;}
.table-scroll-area tr:hover td{background:#FEF7F0;}
.table-scroll-area tr:nth-child(even) td{background:#FCFAF7;}
.table-scroll-area tr:nth-child(even):hover td{background:#FEF7F0;}

/* 表格缩放时内部内容跟随 */
.table-scroll-area .table-inner{transform-origin:top left;transition:transform .2s;}

/* ===== 拖拽占位符 ===== */
.drop-placeholder{border:2px dashed #C00000;background:#FEF2F2;border-radius:8px;margin-bottom:28px;min-height:60px;transition:all .2s;}

/* ===== 响应式 ===== */
@media(max-width:900px){
  .sidebar{display:none;}
  .main{margin-left:0;padding:16px 60px 40px 16px;}
  .float-toolbar{right:8px;padding:6px;}
  .float-toolbar .tb-btn{width:30px;height:30px;font-size:15px;}
}
@media(max-width:600px){
  .main{padding:12px 50px 30px 12px;}
  .two-col{flex-direction:column;}
  .steps-row{flex-direction:column;}
  .step-arrow{transform:rotate(90deg);justify-content:center;}
  .data-cards{flex-direction:column;}
}

/* ===== 滚动条美化 ===== */
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-thumb{background:#d4c5b0;border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:#C00000;}

/* ===== 打印样式 ===== */
@media print{
  .topbar,.sidebar,.float-toolbar{display:none;}
  .main{margin:0;padding:10px;}
  .slide-card{break-inside:avoid;box-shadow:none;border:1px solid #ccc;}
  .table-scroll-area{resize:none;overflow:visible;border:none;max-height:none;}
}
</style>
</head>
<body>

<!-- 顶部栏 -->
<div class="topbar">
  <h1>十五五规划热点精讲<span>7个关键词 × 5类题型 × 考场表达</span></h1>
  <div class="topbar-info">授课对象：<b>国考冲刺班</b> | 时长：<b>90分钟</b> | 方向：<b>国考申论</b></div>
</div>

<!-- 浮动工具栏 -->
<div class="float-toolbar" id="floatToolbar">
  <!-- 字号调节 -->
  <div class="tb-section">
    <div class="tb-label">字号</div>
    <button class="tb-btn" id="fontInc" title="增大字号">A+</button>
    <div class="tb-value" id="fontVal">16px</div>
    <button class="tb-btn" id="fontDec" title="缩小字号">A-</button>
    <button class="tb-btn reset" id="fontReset" title="恢复默认">重置</button>
  </div>
  <!-- 表格缩放 -->
  <div class="tb-section">
    <div class="tb-label">表格</div>
    <button class="tb-btn" id="tableInc" title="放大表格">⊕</button>
    <div class="tb-value" id="tableVal">100%</div>
    <button class="tb-btn" id="tableDec" title="缩小表格">⊖</button>
    <button class="tb-btn reset" id="tableReset" title="恢复默认">重置</button>
  </div>
  <!-- 行距调节 -->
  <div class="tb-section">
    <div class="tb-label">行距</div>
    <button class="tb-btn" id="lhInc" title="增大行距">⇡</button>
    <div class="tb-value" id="lhVal">1.6</div>
    <button class="tb-btn" id="lhDec" title="缩小行距">⇣</button>
    <button class="tb-btn reset" id="lhReset" title="恢复默认">重置</button>
  </div>
</div>

<!-- 侧边导航 -->
<div class="sidebar" id="sidebar"></div>

<!-- 主内容 -->
<div class="main" id="main"></div>

<script>
// ===== 全局设置 =====
let currentFontSize = 16;   // 基础字号 px
let currentTableZoom = 100; // 表格缩放 %
let currentLineHeight = 1.6;
const FONT_MIN = 12, FONT_MAX = 28, FONT_STEP = 2;
const TABLE_MIN = 60, TABLE_MAX = 200, TABLE_STEP = 10;
const LH_MIN = 1.2, LH_MAX = 2.4, LH_STEP = 0.2;

// ===== 字号调节 =====
function applyFontSize(){
  document.querySelectorAll('.slide-body').forEach(el => {
    el.style.fontSize = currentFontSize + 'px';
  });
  // 标题跟着缩放，但保持比例
  document.querySelectorAll('.slide-header h2').forEach(el => {
    el.style.fontSize = Math.round(currentFontSize * 1.25) + 'px';
  });
  document.querySelectorAll('.golden-box').forEach(el => {
    el.style.fontSize = Math.round(currentFontSize * 1.12) + 'px';
  });
  document.querySelectorAll('.data-card .data-num').forEach(el => {
    el.style.fontSize = Math.round(currentFontSize * 2) + 'px';
  });
  document.querySelectorAll('.col-label').forEach(el => {
    el.style.fontSize = Math.round(currentFontSize * 0.81) + 'px';
  });
  document.querySelectorAll('.teach-tip').forEach(el => {
    el.style.fontSize = Math.round(currentFontSize * 0.94) + 'px';
  });
  document.querySelectorAll('.step-box .step-title').forEach(el => {
    el.style.fontSize = Math.round(currentFontSize * 1) + 'px';
  });
  document.querySelectorAll('.step-box .step-desc').forEach(el => {
    el.style.fontSize = Math.round(currentFontSize * 0.81) + 'px';
  });
  document.getElementById('fontVal').textContent = currentFontSize + 'px';
  saveSettings();
}
document.getElementById('fontInc').addEventListener('click', () => {
  if(currentFontSize < FONT_MAX){ currentFontSize += FONT_STEP; applyFontSize(); }
});
document.getElementById('fontDec').addEventListener('click', () => {
  if(currentFontSize > FONT_MIN){ currentFontSize -= FONT_STEP; applyFontSize(); }
});
document.getElementById('fontReset').addEventListener('click', () => {
  currentFontSize = 16; applyFontSize();
});

// ===== 表格缩放 =====
function applyTableZoom(){
  document.querySelectorAll('.table-scroll-area').forEach(el => {
    const inner = el.querySelector('.table-inner');
    if(inner){
      inner.style.transform = 'scale(' + (currentTableZoom/100) + ')';
      inner.style.transformOrigin = 'top left';
      inner.style.width = (10000/currentTableZoom) + '%';
    }
  });
  document.querySelectorAll('.zoom-val').forEach(el => {
    el.textContent = currentTableZoom + '%';
  });
  document.getElementById('tableVal').textContent = currentTableZoom + '%';
  saveSettings();
}
document.getElementById('tableInc').addEventListener('click', () => {
  if(currentTableZoom < TABLE_MAX){ currentTableZoom += TABLE_STEP; applyTableZoom(); }
});
document.getElementById('tableDec').addEventListener('click', () => {
  if(currentTableZoom > TABLE_MIN){ currentTableZoom -= TABLE_STEP; applyTableZoom(); }
});
document.getElementById('tableReset').addEventListener('click', () => {
  currentTableZoom = 100; applyTableZoom();
});

// ===== 行距调节 =====
function applyLineHeight(){
  document.querySelectorAll('.slide-body').forEach(el => {
    el.style.lineHeight = currentLineHeight;
  });
  document.getElementById('lhVal').textContent = currentLineHeight.toFixed(1);
  saveSettings();
}
document.getElementById('lhInc').addEventListener('click', () => {
  if(currentLineHeight < LH_MAX){ currentLineHeight = Math.round((currentLineHeight + LH_STEP)*10)/10; applyLineHeight(); }
});
document.getElementById('lhDec').addEventListener('click', () => {
  if(currentLineHeight > LH_MIN){ currentLineHeight = Math.round((currentLineHeight - LH_STEP)*10)/10; applyLineHeight(); }
});
document.getElementById('lhReset').addEventListener('click', () => {
  currentLineHeight = 1.6; applyLineHeight();
});

// ===== 保存/读取设置 =====
function saveSettings(){
  try{ localStorage.setItem('slideSettings', JSON.stringify({fontSize:currentFontSize, tableZoom:currentTableZoom, lineHeight:currentLineHeight})); }catch(e){}
}
function loadSettings(){
  try{
    const s = JSON.parse(localStorage.getItem('slideSettings'));
    if(s){ currentFontSize = s.fontSize||16; currentTableZoom = s.tableZoom||100; currentLineHeight = s.lineHeight||1.6; }
  }catch(e){}
}

// ===== 幻灯片数据 =====
const slides = [
  {
    id:1, tag:"开篇", time:"1分钟",
    title:"十五五规划热点精讲——考场能用、能写、能拿分",
    body:`<div class="golden-box">今天不是讲政策，是讲考场怎么用政策</div>`
  },
  {
    id:2, tag:"痛点", time:"2分钟",
    title:"你是不是也这样写？",
    body:`
      <div class="wrong-box">"扩大内需"只会写四个字，后面写不下去了</div>
      <div class="wrong-box">"举国体制"以为就是计划经济回来了</div>
      <div class="wrong-box">写对策永远"加强监管、完善制度"，像没写一样</div>
      <div class="teach-tip">每条痛点读出来，停顿1秒，让学生点头。然后说："今天一个一个解决。"</div>
    `
  },
  {
    id:3, tag:"反面", time:"2分钟",
    title:"❌ 阅卷老师最怕看到的答案",
    body:`
      <div class="wrong-box">"要扩大内需，促进消费，拉动经济"——空话套话，零信息量</div>
      <div class="wrong-box">"举国体制就是集中力量办大事"——只说了旧版，没说"新"在哪</div>
      <div class="wrong-box">"要解决就业难问题，创造更多岗位"——没分清总量矛盾和结构矛盾</div>
      <div class="teach-tip">逐条读，每条读完后问："这写了吗？写了。有用吗？没用。"</div>
    `
  },
  {
    id:4, tag:"路线", time:"1分钟",
    title:"今天怎么学？",
    body:`
      <div class="steps-row">
        <div class="step-box step-red"><div class="step-title">听懂政策词</div></div>
        <div class="step-arrow">→</div>
        <div class="step-box step-red"><div class="step-title">记住案例故事</div></div>
        <div class="step-arrow">→</div>
        <div class="step-box step-gold"><div class="step-title">看懂真题考法</div></div>
        <div class="step-arrow">→</div>
        <div class="step-box step-gold"><div class="step-title">学会考场表达</div></div>
        <div class="step-arrow">→</div>
        <div class="step-box step-green"><div class="step-title">能写五类题型</div></div>
      </div>
      <div class="teach-tip">五个环节，每个环节结束后你都能拿走一样东西。</div>
    `
  },
  {
    id:5, tag:"关键词①", time:"3分钟",
    title:"战略基点——内需不是「临时补药」，是「长期主引擎」",
    body:`
      <div class="two-col">
        <div class="col col-left">
          <div class="col-label">📢 政策大白话</div>
          <p>外面风浪大 → 出口靠不住 → 必须靠国内14亿人的市场 → 所以叫"战略"不叫"战术"</p>
          <p style="margin-top:8px;color:#C00000;font-weight:600;">权宜之计是战术，长期依靠是战略。扩大内需不是临时补课，是主引擎换挡。</p>
        </div>
        <div class="col col-right">
          <div class="col-label">✍️ 考场一句话</div>
          <p style="font-size:17px;font-weight:600;color:#2E7D32;">"以国内大循环的确定性对冲外部环境的不确定性"</p>
        </div>
      </div>
    `
  },
  {
    id:6, tag:"案例①", time:"3分钟",
    title:"案例：140万亿的体量，14.1%的物流成本",
    body:`
      <div class="data-cards">

// ===== 单个表格局部缩放 =====
function tableLocalZoom(btn, delta){
  const wrapper = btn.closest('.table-wrapper');
  const inner = wrapper.querySelector('.table-inner');
  const valSpan = wrapper.querySelector('.zoom-val');
  // 读取当前缩放值
  let cur = parseInt(valSpan.textContent) || 100;
  cur += delta;
  if(cur < 60) cur = 60;
  if(cur > 200) cur = 200;
  valSpan.textContent = cur + '%';
  inner.style.transform = 'scale(' + (cur/100) + ')';
  inner.style.transformOrigin = 'top left';
  inner.style.width = (10000/cur) + '%';
}

// ===== 渲染页面 =====
function render(){
  const sidebar = document.getElementById('sidebar');
  const main = document.getElementById('main');
  sidebar.innerHTML = '';
  main.innerHTML = '';

  slides.forEach((s, idx) => {
    // 侧边导航项
    const nav = document.createElement('div');
    nav.className = 'nav-item';
    nav.dataset.id = s.id;
    nav.draggable = true;
    nav.innerHTML = `<span class="drag-handle">⠿</span><span class="num">${idx+1}</span>${s.tag}：${s.title.length>12?s.title.substring(0,12)+'…':s.title}`;
    nav.addEventListener('click', () => {
      document.getElementById('slide-'+s.id)?.scrollIntoView({behavior:'smooth',block:'start'});
    });
    nav.addEventListener('dragstart', e => {
      e.dataTransfer.setData('text/plain', s.id);
      nav.classList.add('dragging');
    });
    nav.addEventListener('dragend', () => nav.classList.remove('dragging'));
    nav.addEventListener('dragover', e => { e.preventDefault(); nav.style.background='#FEF2F2'; });
    nav.addEventListener('dragleave', () => { nav.style.background=''; });
    nav.addEventListener('drop', e => {
      e.preventDefault(); nav.style.background='';
      const fromId = parseInt(e.dataTransfer.getData('text/plain'));
      if(fromId !== s.id) reorderSlides(fromId, s.id);
    });
    sidebar.appendChild(nav);

    // 主内容卡片
    const card = document.createElement('div');
    card.className = 'slide-card';
    card.id = 'slide-'+s.id;
    card.dataset.id = s.id;
    card.draggable = true;
    card.innerHTML = `
      <div class="slide-header">
        <div><h2>${s.tag ? '<span class="slide-tag">'+s.tag+'</span> ' : ''}${s.title}</h2></div>
        <div class="slide-time">⏱ ${s.time}</div>
      </div>
      <div class="slide-body">${s.body}</div>
    `;
    card.addEventListener('dragstart', e => {
      e.dataTransfer.setData('text/plain', s.id);
      card.classList.add('dragging');
    });
    card.addEventListener('dragend', () => card.classList.remove('dragging'));
    card.addEventListener('dragover', e => { e.preventDefault(); card.classList.add('drag-over'); });
    card.addEventListener('dragleave', () => card.classList.remove('drag-over'));
    card.addEventListener('drop', e => {
      e.preventDefault(); card.classList.remove('drag-over');
      const fromId = parseInt(e.dataTransfer.getData('text/plain'));
      if(fromId !== s.id) reorderSlides(fromId, s.id);
    });
    main.appendChild(card);
  });

  // 渲染后应用当前设置
  applyFontSize();
  applyLineHeight();
  applyTableZoom();
  setTimeout(setupScrollSpy, 200);
}

// ===== 重新排序 =====
function reorderSlides(fromId, toId){
  const fromIdx = slides.findIndex(s => s.id === fromId);
  const toIdx = slides.findIndex(s => s.id === toId);
  if(fromIdx < 0 || toIdx < 0) return;
  const [item] = slides.splice(fromIdx, 1);
  slides.splice(toIdx, 0, item);
  render();
  setTimeout(() => {
    document.getElementById('slide-'+toId)?.scrollIntoView({behavior:'smooth',block:'start'});
  }, 100);
}

// ===== 滚动时高亮导航 =====
function setupScrollSpy(){
  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if(entry.isIntersecting){
        const id = entry.target.dataset.id;
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.querySelector(`.nav-item[data-id="${id}"]`)?.classList.add('active');
      }
    });
  }, {threshold:0.3});
  document.querySelectorAll('.slide-card').forEach(c => observer.observe(c));
}

// ===== 键盘快捷键 =====
document.addEventListener('keydown', e => {
  if(e.key === '+' || e.key === '='){ currentFontSize = Math.min(FONT_MAX, currentFontSize + FONT_STEP); applyFontSize(); }
  if(e.key === '-' || e.key === '_'){ currentFontSize = Math.max(FONT_MIN, currentFontSize - FONT_STEP); applyFontSize(); }
  if(e.key === '0'){ currentFontSize = 16; currentTableZoom = 100; currentLineHeight = 1.6; applyFontSize(); applyTableZoom(); applyLineHeight(); }
});

// ===== 初始化 =====
loadSettings();
render();
</script>
