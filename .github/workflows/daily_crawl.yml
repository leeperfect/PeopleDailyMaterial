name: Daily People's Daily Crawl

on:
  schedule:
    # 每天早上8点运行
    - cron: '0 0 * * *'  # UTC时间，对应北京时间8点
  workflow_dispatch:
    # 允许手动触发

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Create config.json
        run: |
          echo '{"notion": {"token": "${{ secrets.NOTION_TOKEN }}", "database_id": "${{ secrets.NOTION_DATABASE_ID }}"}, "crawler": {"request_interval": [1, 3], "timeout": 10, "max_retries": 3, "proxy_enabled": false, "proxies": []}, "logging": {"level": "INFO", "log_file": "crawler.log"}}' > config.json
      
      - name: Run crawler
        run: python main.py
      
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: crawler-logs
          path: crawler.log
